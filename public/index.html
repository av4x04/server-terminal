
<!-- public/index.html -->
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>CloudOS v3 (Persistent)</title>

  <!-- Libraries -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@4/css/xterm.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

  <style>
    :root {
      --glass-bg: rgba(20, 20, 25, 0.85); 
      --glass-border: rgba(255, 255, 255, 0.15);
      --accent-color: #3b82f6; 
      --danger-color: #ef4444;
      --radius-win: 10px;
    }

    * { box-sizing: border-box; user-select: none; outline: none; }
    
    body {
      margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }

    /* Desktop Icons */
    #desktop {
      position: absolute; top: 0; left: 0; padding: 20px;
      display: flex; flex-direction: column; gap: 20px; z-index: 1;
    }
    .desktop-icon {
      width: 80px; text-align: center; cursor: pointer;
      padding: 10px; border-radius: 8px;
      transition: background 0.2s;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }
    .desktop-icon:hover { background: rgba(255,255,255,0.15); backdrop-filter: blur(5px); }
    .desktop-icon i { font-size: 36px; margin-bottom: 8px; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }
    .desktop-icon span { font-size: 13px; font-weight: 500; color: #f0f0f0; }

    /* Windows */
    #windows-container { position: absolute; inset: 0; pointer-events: none; }
    
    .window {
      position: absolute; top: 0; left: 0;
      background: var(--glass-bg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-win);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      display: flex; flex-direction: column;
      pointer-events: auto;
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .window.active { box-shadow: 0 25px 60px rgba(0,0,0,0.8); border-color: rgba(255,255,255,0.25); }

    .title-bar {
      height: 38px; background: linear-gradient(to bottom, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border-bottom: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: flex-start;
      padding-left: 12px; position: relative;
    }

    .title-text { font-size: 13px; font-weight: 600; color: #eee; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

    .window-controls {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      display: flex; gap: 8px;
    }
    .win-btn { width: 13px; height: 13px; border-radius: 50%; cursor: pointer; box-shadow: inset 0 0 4px rgba(0,0,0,0.3); }
    .win-btn.close { background: #ff5f56; border: 1px solid #e0443e; }
    .win-btn.min { background: #ffbd2e; border: 1px solid #dea123; }
    .win-btn:hover { filter: brightness(1.2); }

    .window-content { flex: 1; position: relative; overflow: hidden; background: rgba(0,0,0,0.3); }

    .resize-handle {
      position: absolute; bottom: 0; right: 0; width: 15px; height: 15px;
      cursor: nwse-resize; z-index: 100;
    }

    /* Taskbar */
    #taskbar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 50px;
      background: rgba(10,10,15,0.9); backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
      display: flex; align-items: center; padding: 0 10px; z-index: 9999;
    }
    .start-btn {
        width: 38px; height: 38px; border-radius: 8px; 
        display:flex; align-items:center; justify-content:center;
        cursor:pointer; transition: 0.2s; background: rgba(255,255,255,0.05);
    }
    .start-btn:hover { background: rgba(255,255,255,0.15); box-shadow: 0 0 10px rgba(59,130,246,0.3); }
    
    #task-list { display: flex; gap: 6px; flex: 1; margin-left: 12px; }
    .task-item {
        padding: 0 14px; height: 36px; border-radius: 6px;
        background: rgba(255,255,255,0.05);
        display: flex; align-items: center; gap: 10px;
        font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent;
        max-width: 180px; transition: 0.2s;
    }
    .task-item:hover { background: rgba(255,255,255,0.12); }
    .task-item.active { background: rgba(255,255,255,0.15); border-bottom-color: var(--accent-color); }
    .task-item.minimized { opacity: 0.6; }

    /* Context Menu */
    #context-menu {
        position: fixed; display: none; z-index: 99999;
        background: rgba(30, 30, 35, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid #444; border-radius: 6px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        min-width: 180px; padding: 5px 0;
    }
    .ctx-item {
        padding: 8px 15px; font-size: 13px; display: flex; align-items: center; gap: 10px;
        cursor: pointer; color: #ddd;
    }
    .ctx-item:hover { background: var(--accent-color); color: #fff; }
    .ctx-item.danger:hover { background: var(--danger-color); }
    .ctx-divider { height: 1px; background: #444; margin: 4px 0; }

    /* App Specifics */
    .fm-layout { height: 100%; display: flex; flex-direction: column; background: #1a1a1a; color: #ddd; }
    .fm-toolbar { padding: 10px; background: #252525; border-bottom: 1px solid #333; display: flex; gap: 10px; align-items: center; }
    .fm-path { 
        padding: 6px 12px; background: #111; border: 1px solid #333; 
        border-radius: 4px; flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #aaa; 
    }
    .fm-grid { 
        flex: 1; padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); 
        grid-auto-rows: min-content; gap: 15px; overflow-y: auto; 
    }
    .fm-item { 
        display: flex; flex-direction: column; align-items: center; text-align: center; 
        cursor: pointer; padding: 8px; border-radius: 6px; 
    }
    .fm-item:hover { background: rgba(255,255,255,0.1); }
    .fm-item.selected { background: rgba(59,130,246,0.3); border: 1px solid rgba(59,130,246,0.5); }
    .fm-item i { font-size: 32px; margin-bottom: 8px; }
    .fm-item span { font-size: 12px; word-break: break-all; line-height: 1.3; }
    
    /* Upload Overlay */
    .upload-overlay {
        position: absolute; inset: 0; background: rgba(0,0,0,0.7);
        display: none; align-items: center; justify-content: center;
        flex-direction: column; gap: 10px; z-index: 50;
    }
    .upload-overlay.active { display: flex; }
    .spinner { border: 3px solid #333; border-top: 3px solid #fff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Start Menu */
    #start-menu {
        position: absolute; bottom: 60px; left: 10px;
        width: 300px; background: rgba(25,25,25,0.9);
        backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border); border-radius: 10px;
        padding: 12px; display: none; z-index: 10000;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #start-menu.visible { display: block; animation: slideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
    
    .menu-item {
        padding: 12px; border-radius: 8px; cursor: pointer;
        display: flex; align-items: center; gap: 12px;
        transition: 0.1s; color: #eee;
    }
    .menu-item:hover { background: rgba(255,255,255,0.1); }
    
    #loading-screen { position: fixed; inset: 0; background: #000; z-index: 99999; display: flex; align-items: center; justify-content: center; color: #fff; font-family: monospace; }
  </style>
</head>
<body>
  <div id="loading-screen">
      <div style="text-align:center">
          <i class="fas fa-circle-notch fa-spin" style="font-size:30px; margin-bottom:20px;"></i>
          <br>Booting Linux CloudOS v3.0...
      </div>
  </div>

  <div id="context-menu"></div>

  <!-- Start Menu -->
  <div id="start-menu">
      <div style="padding: 0 10px 10px; border-bottom:1px solid #444; margin-bottom:5px; font-weight:600;">Applications</div>
      <div class="menu-item" onclick="app.requestOpen('term'); toggleStart()">
          <i class="fas fa-terminal" style="color:#ddd; width:20px;"></i> Terminal
      </div>
      <div class="menu-item" onclick="app.requestOpen('browser'); toggleStart()">
          <i class="fas fa-globe" style="color:#4ade80; width:20px;"></i> Cloud Browser
      </div>
      <div class="menu-item" onclick="app.requestOpen('fm'); toggleStart()">
          <i class="fas fa-folder-open" style="color:#60a5fa; width:20px;"></i> File Manager
      </div>
      <div class="menu-item" onclick="app.requestOpen('store'); toggleStart()">
          <i class="fas fa-shopping-bag" style="color:#f472b6; width:20px;"></i> App Store
      </div>
      <div class="menu-item" onclick="app.requestOpen('sys'); toggleStart()">
          <i class="fas fa-microchip" style="color:#fbbf24; width:20px;"></i> System Monitor
      </div>
      <hr style="border-color:#444; opacity:0.5; margin: 8px 0;">
      <div class="menu-item" onclick="location.reload()">
          <i class="fas fa-power-off" style="color:#ff5f56; width:20px;"></i> Restart Session
      </div>
  </div>

  <div id="desktop">
      <div class="desktop-icon" ondblclick="app.requestOpen('term')">
          <i class="fas fa-terminal" style="color:#eee;"></i><span>Terminal</span>
      </div>
      <div class="desktop-icon" ondblclick="app.requestOpen('browser')">
          <i class="fas fa-globe" style="color:#4ade80;"></i><span>Web</span>
      </div>
      <div class="desktop-icon" ondblclick="app.requestOpen('fm')">
          <i class="fas fa-folder" style="color:#60a5fa;"></i><span>Files</span>
      </div>
      <div class="desktop-icon" ondblclick="app.requestOpen('store')">
          <i class="fas fa-shopping-bag" style="color:#f472b6;"></i><span>Store</span>
      </div>
      <div class="desktop-icon" ondblclick="app.requestOpen('sys')">
          <i class="fas fa-hdd" style="color:#fbbf24;"></i><span>System</span>
      </div>
  </div>

  <div id="windows-container"></div>

  <div id="taskbar">
      <div style="display:flex; align-items:center;">
          <div class="start-btn" onclick="toggleStart()">
              <i class="fab fa-linux" style="font-size:24px;"></i>
          </div>
          <div id="task-list"></div>
      </div>
      <div style="font-size:12px; color:#aaa; margin-right:10px; font-family:monospace;">
          v3.0 Persistent <i class="fas fa-signal" style="margin-left:5px;"></i>
      </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm@4/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>
  <script src="client.js"></script>
  <script>
      function toggleStart() {
          document.getElementById('start-menu').classList.toggle('visible');
      }
      document.addEventListener('click', (e) => {
          const menu = document.getElementById('start-menu');
          const btn = document.querySelector('.start-btn');
          const ctx = document.getElementById('context-menu');
          
          if(!menu.contains(e.target) && !btn.contains(e.target)) {
              menu.classList.remove('visible');
          }
          // Hide context menu on click
          ctx.style.display = 'none';
      });
  </script>
</body>
</html>
